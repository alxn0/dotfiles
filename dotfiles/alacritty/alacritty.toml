[env]
TERM = "xterm-256color"

[font.normal]
#family = "Hack Nerd Font Mono"
family = "Berkeley Mono"
style = "Regular"

[window]
decorations = "none"
opacity = 1
startup_mode = "Maximized"

[window.padding]
x = 5
y = 5

# Shift-Enter as kitty-protocol CSI-u sequence. Understood natively by
# Claude Code; forwarded by tmux (extended-keys) to Vim as <S-CR>.
[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B[13;2u"
